{% load i18n %}
<div class="modal fade" id="unifiedDocumentModal" tabindex="-1"
     x-data="unifiedDocumentModalApp()"
     @open-document-modal.window="openModal($event.detail)">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4" style="background-color: var(--app-card-bg); color: var(--app-card-color);">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-file-earmark-arrow-up me-2"></i>{% trans "Upload Document" %}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form method="post" action="{% url 'finance:document_upload' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" name="next" :value="nextUrl">
                <div class="modal-body pt-3">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase opacity-75">{% trans "Domain" %}</label>
                            <select name="domain" x-model="domain" @change="onDomainChange()" class="form-select" required>
                                {% for val, label in doc_domain_choices %}
                                <option value="{{ val }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6" x-show="availableObjects.length > 0">
                            <label class="form-label small fw-bold text-uppercase opacity-75">{% trans "Assigned Object / Contract" %}</label>
                            <select :name="objectFieldName" x-model="objectId" class="form-select">
                                <option value="">{% trans "-- Optional / None --" %}</option>
                                <template x-for="obj in availableObjects" :key="obj.id">
                                    <option :value="String(obj.id)" :selected="String(obj.id) === String(objectId)" x-text="obj.name"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase opacity-75">{% trans "Document Title" %} <span class="text-muted fw-normal">({% trans "optional, aus Dateiname" %})</span></label>
                            <input type="text" name="title" x-model="title" class="form-control" placeholder="{% trans 'z. B. Kaufvertrag, Police (leer = aus Dateiname)' %}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase opacity-75">{% trans "Category" %}</label>
                            <select name="category" x-model="category" class="form-select" required>
                                <template x-for="cat in availableCategories" :key="cat.value">
                                    <option :value="cat.value" :selected="cat.value === category" x-text="cat.label"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase opacity-75">{% trans "Date" %}</label>
                            <input type="date" name="date" x-model="dateValue" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase opacity-75">{% trans "Amount (€, optional)" %}</label>
                            <input type="number" name="amount" step="0.01" class="form-control font-monospace" placeholder="0.00">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold text-uppercase opacity-75">{% trans "File (PDF, Image, etc.)" %}</label>
                            <input type="file" name="file" class="form-control" required @change="onFileChange($event)">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold text-uppercase opacity-75">{% trans "Notes" %}</label>
                            <textarea name="notes" class="form-control" rows="2" placeholder="{% trans 'Optional notes on this document...' %}"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4" style="background: var(--app-gradient); border: none;">
                        <i class="bi bi-cloud-upload me-1"></i>{% trans "Upload" %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function unifiedDocumentModalApp() {
    return {
        domain: 'real_estate',
        title: '',
        objectId: '',
        category: 'other',
        dateValue: new Date().toISOString().split('T')[0],
        nextUrl: window.location.pathname + window.location.search,
        domainObjects: {{ doc_domain_objects_json|safe }},
        domainCategories: {{ doc_domain_categories_json|safe }},
        get availableObjects() {
            return this.domainObjects[this.domain] || [];
        },
        get availableCategories() {
            return this.domainCategories[this.domain] || [];
        },
        get objectFieldName() {
            const map = {
                real_estate: 'real_estate',
                loan: 'loan',
                insurance: 'insurance_policy',
                pension: 'pension',
                asset: 'asset',
                physical_asset: 'physical_asset',
            };
            return map[this.domain] || '';
        },
        openModal(detail) {
            const d = detail || {};
            this.domain = d.domain || 'real_estate';
            this.title = '';
            this.dateValue = new Date().toISOString().split('T')[0];
            this.nextUrl = d.nextUrl || (window.location.pathname + window.location.search);
            const cats = this.domainCategories[this.domain] || [];
            const targetCat = d.category || (cats.length ? cats[0].value : 'other');
            const targetObj = d.objectId ? String(d.objectId) : '';
            this.$nextTick(() => {
                this.category = targetCat;
                this.objectId = targetObj;
            });
            bootstrap.Modal.getOrCreateInstance(document.getElementById('unifiedDocumentModal')).show();
        },
        onDomainChange() {
            this.objectId = '';
            const cats = this.availableCategories;
            this.$nextTick(() => {
                if (cats.length && !cats.some(c => c.value === this.category)) {
                    this.category = cats[0].value;
                }
            });
        },
        onFileChange(e) {
            const file = e.target.files && e.target.files[0];
            if (file && !this.title.trim()) {
                const fname = file.name || '';
                const base = fname.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
                if (base) {
                    this.title = base.charAt(0).toUpperCase() + base.slice(1);
                }
            }
        }
    };
}
</script>
