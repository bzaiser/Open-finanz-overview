{% extends 'base.html' %}
{% load i18n crispy_forms_tags %}

{% block title %}{% trans "Login" %} - Finanzplan{% endblock %}

{% block content %}
<div class="row justify-content-center my-3 my-md-4">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 text-center"><i class="bi bi-box-arrow-in-right me-2"></i>{% trans "Login" %}</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">{% trans "Login" %}</button>
                    </div>
                </form>

                <div class="mt-4 pt-3 border-top">
                    <form method="post" action="{% url 'load_demo_family' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-success w-100 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-people-fill me-1"></i> {% trans "Demouser mit Demodaten importieren" %}
                        </button>
                    </form>
                </div>
            </div>
            <div class="card-footer text-center py-3 bg-transparent border-top">
                <a href="{% url 'signup' %}" class="btn btn-link text-decoration-none">
                    <i class="bi bi-person-plus me-1"></i>{% trans "Neuen Benutzer registrieren" %}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
